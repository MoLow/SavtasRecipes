AWSTemplateFormatVersion: "2010-09-09"
Description: "Savta's Recipes — S3 static website with CloudFront and custom domain"

Parameters:
  DomainName:
    Type: String
    Default: recipes.atlow.co.il
  HostedZoneId:
    Type: String
    Default: ZBK1TP4S8FJSM

Resources:
  # ── S3 Bucket ──
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── CloudFront Origin Access Control ──
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 Bucket Policy (CloudFront only) ──
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: AllowCloudFrontListBucket
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt WebsiteBucket.Arn
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ── ACM Certificate (must be us-east-1 for CloudFront) ──
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ── CloudFront Function (clean URL routing for static export) ──
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: "Append .html to extensionless paths for Next.js static export"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var headers = request.headers;
          var accept = headers['accept'] ? headers['accept'].value : '';
          var wantsMarkdown = accept.indexOf('text/markdown') !== -1;
          if (uri === '/') {
            if (wantsMarkdown) {
              request.uri = '/index.md';
              return request;
            }
            // 302 to a locale so agents/crawlers see a real page immediately
            // rather than a client-side redirect that destroys the JS execution
            // context mid-probe. Prefer cookie > Accept-Language > 'en'.
            var locale = 'en';
            var cookie = headers['cookie'] ? headers['cookie'].value : '';
            var m = cookie.match(/(?:^|;\s*)locale=(he|en)/);
            if (m) {
              locale = m[1];
            } else {
              var lang = headers['accept-language']
                ? headers['accept-language'].value.toLowerCase()
                : '';
              if (/\b(he|iw)\b/.test(lang)) locale = 'he';
            }
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                'location': { value: '/' + locale },
                'cache-control': { value: 'no-store' },
                'vary': { value: 'cookie, accept-language' }
              }
            };
          }
          var ext = wantsMarkdown ? '.md' : '.html';
          if (uri.endsWith('/')) {
            request.uri = uri.slice(0, -1) + ext;
          } else if (!uri.includes('.')) {
            request.uri += ext;
          }
          return request;
        }


  # -- CloudFront Function (set Content-Type: text/markdown for .md responses) --
  MarkdownResponseFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-markdown-ct"
      AutoPublish: true
      FunctionConfig:
        Comment: Set text/markdown Content-Type for .md responses (Markdown for Agents)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          if (event.request.uri.endsWith('.md')) {
            response.headers['content-type'] = { value: 'text/markdown; charset=utf-8' };
          }
          return response;
        }

  # -- CloudFront Function (set Content-Type for /.well-known/api-catalog) --
  ApiCatalogContentTypeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-api-catalog-ct"
      AutoPublish: true
      FunctionConfig:
        Comment: Set application/linkset+json Content-Type for RFC 9727 API Catalog
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          response.headers['content-type'] = {value: 'application/linkset+json'};
          return response;
        }
  # -- CloudFront Response Headers Policy (agent discovery) --
  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-agent-ready"
        Comment: RFC 8288 Link header for agent discovery (RFC 9727) + Vary for markdown negotiation
        CustomHeadersConfig:
          Items:
            - Header: Link
              Value: '</.well-known/api-catalog>; rel="api-catalog"'
              Override: false
            - Header: Vary
              Value: Accept
              Override: false

  # ── CloudFront Distribution ──
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        CacheBehaviors:
          - PathPattern: "/.well-known/api-catalog"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-response
                FunctionARN: !GetAtt ApiCatalogContentTypeFunction.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt MarkdownResponseFunction.FunctionARN
        # SPA fallback: serve index.html for 404s (Next.js static export)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Comment: "Savta's Recipes"

  # ── Route53 DNS Record ──
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (global constant)

Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref CloudFrontDistribution
  DistributionDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  WebsiteUrl:
    Value: !Sub "https://${DomainName}"
