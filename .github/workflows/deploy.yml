name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name savtas-recipes \
            --no-fail-on-empty-changeset

      - name: Sync to S3
        run: |
          # Pre-gzip all text assets in-place so S3 serves them compressed.
          # .txt files (robots.txt, etc.) are intentionally left uncompressed —
          # they're tiny, and many bot HTTP clients don't advertise gzip and
          # would otherwise receive unreadable bytes.
          find website/out -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.svg" -o -name "*.md" \) \
            -exec sh -c 'gzip -9 "$1" && mv "${1}.gz" "$1"' _ {} \;

          # Binary assets (images, fonts) — no compression, auto content-type
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.css" \
            --exclude "*.js" \
            --exclude "*.json" \
            --exclude "*.svg" \
            --exclude "*.md" \
            --exclude "*.txt"

          # CSS (long cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.css"

          # JavaScript (long cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/javascript" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.js"

          # SVG (long cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/svg+xml" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.svg"

          # HTML (short cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=60, s-maxage=3600" \
            --content-type "text/html" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.html"

          # JSON (short cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=60, s-maxage=3600" \
            --content-type "application/json" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.json"

          # Markdown (short cache, gzip-encoded)
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=60, s-maxage=3600" \
            --content-type "text/markdown" \
            --content-encoding "gzip" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.md"

          # Plain text — robots.txt etc. Served uncompressed so bot HTTP
          # clients that don't advertise gzip get readable content.
          aws s3 sync website/out/ s3://recipes.atlow.co.il \
            --delete \
            --cache-control "public, max-age=300, must-revalidate" \
            --content-type "text/plain; charset=utf-8" \
            --no-guess-mime-type \
            --exclude "*" \
            --include "*.txt"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name savtas-recipes \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
